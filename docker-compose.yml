version: '3.8'

services:
  coorpdns:
    build:
      context: .
      dockerfile: Dockerfile
    image: coorpdns:latest
    container_name: coorpdns
    restart: unless-stopped
    # Para receber o IP real de cada cliente Wi-Fi e evitar NAT, network_mode: host é recomendado no Linux
    # Em Windows/macOS, mapeie as portas diretamente abaixo
    ports:
      - "53:53/udp"
      - "53:53/tcp"
      - "8080:8080/tcp"
    environment:
      - TZ=America/Sao_Paulo
    volumes:
      - ./data:/app/data
      - ./config:/app/config
    cap_add:
      - NET_ADMIN
      - NET_BIND_SERVICE
